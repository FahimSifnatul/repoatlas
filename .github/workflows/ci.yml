name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  installer:
    name: installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell scripts
        run: shellcheck -s sh install.sh
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Installer tests
        run: cargo test --locked --test install
      - name: Install from this checkout, as a user would
        run: |
          sh install.sh
          "$HOME/.local/bin/repoatlas" --version
          "$HOME/.local/bin/repoatlas" . -o "$RUNNER_TEMP/self.html" --no-open
