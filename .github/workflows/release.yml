name: release

# Push a tag such as v1.0.0 and this publishes a GitHub Release with the single-file `repoatlas`
# executable attached. install.sh downloads exactly that file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in the code
        run: |
          version=$(python -c "import repoatlas; print(repoatlas.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match repoatlas.__version__ ($version). Fix one of them and re-tag." >&2
            exit 1
          fi
      - run: python -m unittest discover -s tests
      - name: Build the executable
        run: |
          python scripts/build_binary.py
          cd dist && sha256sum repoatlas > repoatlas.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/repoatlas dist/repoatlas.sha256 --title "$GITHUB_REF_NAME" --generate-notes
