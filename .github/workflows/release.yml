name: release

# Publishes a GitHub Release with the single-file `repoatlas` executable attached. install.sh downloads exactly that file.
# Two ways to trigger it:
#   - bump __version__ in repoatlas/__init__.py and push to master: this tags vX.Y.Z on that commit and releases it
#     (a push whose version is already tagged does nothing)
#   - or push a tag such as v1.0.0 yourself; it must match __version__
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

concurrency:                          # never two releases at once; a queued run waits instead of being cancelled
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide the tag
        id: tag
        run: |
          tag="v$(python -c "import repoatlas; print(repoatlas.__version__)")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match repoatlas.__version__ (${tag#v}). Fix one of them and re-tag." >&2
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release. Bump __version__ in repoatlas/__init__.py to publish a new one."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag
        run: python -m unittest discover -s tests
      - name: Build the executable
        if: steps.tag.outputs.tag
        run: |
          python scripts/build_binary.py
          dist/repoatlas --version
          cd dist && sha256sum repoatlas > repoatlas.sha256
      - name: Publish the release
        if: steps.tag.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # --target creates the tag on this commit when it does not exist yet (a version bump pushed to master)
        run: gh release create "$TAG" dist/repoatlas dist/repoatlas.sha256 --target "$GITHUB_SHA" --title "$TAG" --generate-notes
