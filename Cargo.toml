[package]
name = "repoatlas"
version = "2.0.0"
edition = "2021"
description = "Turn any code repository into an interactive, layer-by-layer architecture map"
license = "MIT"
repository = "https://github.com/FahimSifnatul/repoatlas"
rust-version = "1.82"

[dependencies]
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.14"
ignore = "0.4"
protobuf = "=3.7.2"
rayon = "1"
regex = "1"
scip = "0.10"
serde_json = "1"
streaming-iterator = "0.1"
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
