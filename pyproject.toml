[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# "repoatlas" is already taken on PyPI by a different project, so the *distribution* is called
# repoatlas-tool. The command you type and the module you import are still `repoatlas`.
name = "repoatlas-tool"
dynamic = ["version"]
description = "Turn any code repository into an interactive, layer-by-layer architecture map"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []                     # standard library only
keywords = ["architecture", "visualization", "code-analysis", "documentation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USER/repoatlas"
Issues = "https://github.com/YOUR_GITHUB_USER/repoatlas/issues"

[project.scripts]
repoatlas = "repoatlas.cli:main"          # <- this line is what creates the `repoatlas` command

[tool.setuptools]
packages = ["repoatlas", "repoatlas.languages"]

[tool.setuptools.package-data]
repoatlas = ["viewer.html"]

[tool.setuptools.dynamic]
version = { attr = "repoatlas.__version__" }
