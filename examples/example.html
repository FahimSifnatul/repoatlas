<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>full-stack-fastapi-template - architecture map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f9; --grid:#e8ecf3; --ink:#14213d; --ink2:#4a5876; --ink3:#7d8aa5; --line:#d6deea;
  --edge:#9aa7bf; --focus:#3b5bdb;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.55 var(--body);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:14px;height:54px}
.brand{display:flex;align-items:center;gap:8px;font:700 18px var(--display);letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.repo{color:var(--ink3);font-size:14px;padding-left:14px;border-left:1.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{margin-left:auto;display:flex;gap:6px;height:100%}
.tabs button{border:0;background:none;padding:0 12px;font:600 14.5px var(--body);color:var(--ink2);border-bottom:3px solid transparent;margin-top:3px}
.tabs button[aria-current=page]{color:var(--ink);border-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:22px 24px 70px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--ink3);font-size:13px}

/* breadcrumb */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:14px;margin-bottom:18px;min-height:24px}
.crumbs[hidden]{display:none}
.crumb{border:0;background:none;color:var(--ink2);padding:1px 4px;border-radius:6px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:2px}
.crumb:hover{color:var(--ink);text-decoration-color:var(--ink3)}
.sep{color:var(--line);font-weight:700}
.here{font-weight:600}

/* intro + hero text */
.intro h1,.hero h1{font:700 clamp(30px,5vw,52px)/1.05 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.lead{max-width:68ch;color:var(--ink2);font-size:17px;margin-top:10px}
.facts{margin-top:12px;color:var(--ink2)}
.facts b{color:var(--ink);font-weight:650}
.lang{margin-top:14px;max-width:520px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.bar i{display:block;min-width:3px}
.lang ul{display:flex;gap:4px 16px;flex-wrap:wrap;list-style:none;padding:0;margin-top:8px;font-size:13px;color:var(--ink2)}
.lang li span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.station{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;margin-left:13px;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 8%,#fff);transition:box-shadow .15s}
.ftag{color:var(--ink2);margin-top:2px}

.callout{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:36px;padding:16px 20px;border-radius:14px;
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;font:600 16px var(--display)}
.callout span{font:400 14px var(--body);opacity:.8}
.callout:hover{background:#1f3158}

/* sections */
.sec{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin:34px 0 14px}
.sec h2{font:650 21px var(--display);letter-spacing:-.01em}
.sec p{color:var(--ink3);font-size:14px}
.built{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;align-items:baseline}
.built dt{color:var(--ink2);font-weight:600;font-size:14px}
.built dd{display:flex;flex-wrap:wrap;gap:6px}
.lib{font:500 13px var(--mono);background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:1px 8px}

/* hero for any opened thing */
.hero{--c:#4f5bd5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.station.big{width:68px;height:68px;margin:0;box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 16%,transparent)}
.hline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.1}
.pill{font:600 12.5px var(--body);border:1.5px solid var(--c);color:color-mix(in srgb,var(--c) 70%,#000);border-radius:99px;padding:1px 10px;background:#fff}
.pill.go{--c:#14213d;background:var(--ink);color:#fff;display:inline-flex;gap:5px;align-items:center}
.path{font:13px var(--mono);color:var(--ink3);margin-top:6px;overflow-wrap:anywhere}
.lrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.lt{font-weight:600;font-size:13.5px;color:var(--ink2);min-width:76px}
.ref{--c:#4f5bd5;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:99px;
  padding:2px 12px 2px 9px;font:500 13.5px var(--body);max-width:100%}
.ref i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.ref:hover{border-color:var(--c)}
.ref.plain{cursor:default}
.ref[aria-current]{border-color:var(--ink);font-weight:650}
.ref.plain:hover{border-color:var(--line)}

/* graph: stations connected by lines */
.graph{overflow-x:auto;padding:8px 2px 16px;margin:0 -2px}
.inner{position:relative;width:max-content;min-width:100%}
.cols{display:flex;gap:var(--cg,84px)}
.col{width:var(--cw,262px);flex:none;display:flex;flex-direction:column;justify-content:center;gap:14px}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
/* roads: grey asphalt with a white centre line, an arrow where they enter a building, cars driving the way the calls go */
.road{transition:opacity .15s}
.road .asp{fill:none;stroke:#c9d0dd;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.road .mid{fill:none;stroke:#fff;stroke-width:1.3;stroke-dasharray:6 7;opacity:.9}
.road .tip{fill:#8896b0;stroke:none}
.road.conv .asp{stroke:#b4bdcf;stroke-width:1.8px;stroke-dasharray:1.5 5}   /* a footpath: loaded by the framework, never called */
.road.conv .mid{display:none}
.car rect:first-child{stroke:#fff;stroke-width:1}
.inner.traced .road:not(.on){opacity:.3}
.inner.traced .road:not(.on) .car{display:none}
.inner.traced .road.on .asp,.inner.focus .road.hl .asp{stroke:var(--t)}
.inner.traced .road.on .tip,.inner.focus .road.hl .tip{fill:var(--t)}
.inner.traced .node:not(.on){opacity:.45}
.inner.focus .road:not(.hl){opacity:.25}
.inner.focus .road.hl{opacity:1}
.inner.focus .node:not(.rel){opacity:.5}
.inner.focus .node.rel{opacity:1}
.edges .dot rect:first-child{stroke:#fff;stroke-width:1.5}

.node{--c:#4f5bd5;position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-left:6px solid var(--c);border-radius:10px;padding:11px 14px 11px;transition:background .12s,border-color .12s,opacity .15s}
.node:hover{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:var(--c)}
.map .col{justify-content:flex-start}   /* a long column of parts would push short ones far down the page */
.node.run[aria-current=true]{background:color-mix(in srgb,var(--ink) 8%,#fff);border-color:var(--ink)}
.node[hidden]{display:none}
.node.ping{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent);opacity:1!important}
.more{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:5px;font-size:13px;color:var(--ink2)}
.more:hover{border-color:var(--ink3);color:var(--ink)}
.lanes .node{padding:7px 10px;border-left-width:5px}
.lanes .nm{font-size:14px}
.lanes .ms{font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:12.5px}
.lg{display:inline-flex;align-items:center;gap:5px;color:var(--ink3)}
.lg b{font-weight:600;color:var(--ink)}
.lanes .ds{display:none}
.node.io{cursor:default;border-style:dashed;border-left-style:solid;background:color-mix(in srgb,var(--c) 6%,#fff)}
.nm{display:flex;align-items:center;gap:8px;font:650 16px/1.25 var(--display);color:var(--ink)}
.nm svg{flex:none;color:var(--c)}
.nm span{min-width:0;overflow-wrap:anywhere}
.pth{font:11.5px var(--mono);color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds{font-size:13px;color:var(--ink2);margin:5px 0 8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ms{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--ink3)}
.ms b{color:var(--ink2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
.sub{margin:26px 0 12px;font:650 16px var(--display)}
.sub span{font:400 13.5px var(--body);color:var(--ink3);margin-left:10px}

/* file details */
.syms{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.sym{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 14px;padding:11px 16px;border-top:1px solid var(--line)}
.sym:first-child{border-top:0}
.kind{--k:#4f5bd5;align-self:start;font:600 12px var(--body);text-align:center;border-radius:6px;padding:2px 0;color:var(--k);background:color-mix(in srgb,var(--k) 12%,#fff)}
.sname{font:500 14px var(--mono);overflow-wrap:anywhere}
.sname em{font-style:normal;color:var(--ink3)}
.sname small{font:400 12px var(--body);color:var(--ink3);margin-left:10px}
.sdoc{grid-column:2;color:var(--ink2);font-size:13.5px}
.mem{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.mem span{font:12px var(--mono);color:var(--ink2);background:var(--paper);border-radius:5px;padding:1px 7px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--ink2)}
.rels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.rpanel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.rpanel h3{font:650 16px var(--display)}
.rpanel>p{color:var(--ink3);font-size:13px;margin:2px 0 12px}
.rpanel .chips{display:flex;flex-wrap:wrap;gap:8px}
.rpanel .none{color:var(--ink3);font-size:14px}

/* how it runs: one line per step, indented under the step that makes it */
.steps{list-style:none;padding:0;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.st{--c:#4f5bd5;--d:0;display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 8px;padding:6px 14px 6px 0;border-top:1px solid var(--grid);transition:background .3s}
.st:first-child{border-top:0}
.st[hidden]{display:none}
.st.flash{background:color-mix(in srgb,var(--c) 14%,#fff)}
.st.guess .sn{text-decoration:underline dashed var(--ink3);text-underline-offset:4px}
.st .no{font:500 12px/22px var(--mono);color:var(--ink3);text-align:right}
.st .bd{min-width:0;padding-left:calc(min(var(--d),10)*22px);border-left:0}
.sl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:22px}
.tg{flex:none;width:18px;height:18px;border:0;background:none;padding:0;color:var(--ink3);font-size:12px;line-height:18px;transition:transform .12s}
button.tg[aria-expanded=true]{transform:rotate(90deg)}
.sn{border:0;background:none;padding:0;font:500 14px var(--mono);color:var(--ink);text-align:left;overflow-wrap:anywhere;
  border-bottom:2px solid color-mix(in srgb,var(--c) 45%,#fff)}
.sn:hover{border-color:var(--c)}
.k-start>.bd .sn{font-weight:700}
.k-dispatch>.bd .sn{font-style:italic}
.sw{font:12px var(--mono);color:var(--ink3)}
.tag{font:600 11.5px var(--body);color:var(--ink2);border:1px dashed var(--line);border-radius:99px;padding:0 8px}
.again{border:0;background:none;padding:0;font:12.5px var(--body);color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.again:hover{color:var(--ink)}
.iop{--k:#4f5bd5;font:600 11.5px var(--body);border-radius:99px;padding:0 8px;color:color-mix(in srgb,var(--k) 75%,#000);background:color-mix(in srgb,var(--k) 13%,#fff)}
.sdoc2{color:var(--ink2);font-size:13px;margin:1px 0 0 28px;overflow-wrap:anywhere}
.sm{color:var(--ink3);font-size:13px}
.st .bd>.sm{margin-left:28px}
.verb{font:700 11.5px var(--mono);color:#fff;background:var(--ink);border-radius:5px;padding:1px 7px}
.rpath{font:600 clamp(20px,3vw,28px)/1.2 var(--mono);overflow-wrap:anywhere}

/* how it runs: the journeys on the left; the map and the picked journey's steps on the right */
.trace{--w:min(1600px,calc(100vw - 48px));width:var(--w);margin-left:min(0px,calc((100% - var(--w)) / 2));
  display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
.trace .graph.wide{width:auto;margin-left:-2px}
.trace.solo{grid-template-columns:minmax(0,1fr)}
.pane>.sec:first-child{margin-top:12px}
.rail{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px}
.rail h3{font:650 12px var(--body);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 6px}
.find{width:100%;font:inherit;font-size:14px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:4px}
.jr{display:flex;align-items:center;gap:8px;width:100%;min-width:0;border:0;background:none;text-align:left;padding:5px 8px;border-radius:7px;font-size:14px}
.jr:hover{background:var(--paper)}
.jr[aria-current]{background:var(--ink);color:#fff}
.jr[hidden],.grp[hidden]{display:none}
.jr span:last-child,.jr code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr code{font:500 13px var(--mono)}
.jr .verb{flex:none;min-width:50px;text-align:center;font-size:10.5px}
.jr[aria-current] .verb{background:#fff;color:var(--ink)}
.grp summary{display:flex;gap:8px;align-items:center;padding:6px 8px 2px;cursor:pointer;font:600 12.5px var(--mono);color:var(--ink2)}
.grp summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp summary i{margin-left:auto;font:600 11.5px var(--body);font-style:normal;color:var(--ink3)}
.pick{display:none;margin-bottom:12px;width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.rail-pick{display:block;margin:0 0 4px;width:100%;font:inherit;font-size:14px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.prog[hidden]{display:none}
.play{margin-left:auto;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:99px;padding:3px 14px;font:600 13.5px var(--body)}
.play:hover{background:#1f3158}
.play:disabled{opacity:.5;cursor:default}

/* motion that answers a click: zoom in when going deeper, out when going up */
.view.zin{animation:zin .24s cubic-bezier(.2,.7,.2,1)}
.view.zout{animation:zout .24s cubic-bezier(.2,.7,.2,1)}
@keyframes zin{from{opacity:0;transform:scale(.97)}}
@keyframes zout{from{opacity:0;transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .trace{grid-template-columns:minmax(0,1fr)}.rail{display:none}.pick{display:block}
}
@media (max-width:720px){
  main{padding:16px 16px 60px}.top .in{padding:0 16px}.repo{display:none}
  .station{width:40px;height:40px;margin-left:10px}
  .hero{grid-template-columns:1fr;gap:14px}.station.big{width:52px;height:52px}
  .built{grid-template-columns:1fr;gap:4px}
  .sym{grid-template-columns:1fr}.sdoc,.mem{grid-column:1}
  .st{grid-template-columns:30px minmax(0,1fr)}.st .bd{padding-left:calc(min(var(--d),6)*12px)}.sdoc2{margin-left:0}
}
</style>
</head>

<main>

</main>
<footer id="foot"></footer>

      if (!paths.length) return done();
      const dot = carShape('var(--ink)');   // a car drives each road of the journey in turn
      dot.setAttribute('class', 'dot');
      sv.append(dot);
      let i = 0, t0 = null;
      const tick = ts => {
        const p = paths[i];
        if (my !== token || !p.isConnected) { dot.remove(); return done(); }
        if (t0 === null) t0 = ts;
        const len = p.getTotalLength(), f = Math.min(1, (ts - t0) / 650), at = f * len;
        const pt = p.getPointAtLength(at), a0 = p.getPointAtLength(Math.max(0, at - 2)), a1 = p.getPointAtLength(Math.min(len, at + 2));
        dot.setAttribute('transform', `translate(${pt.x},${pt.y}) rotate(${Math.atan2(a1.y - a0.y, a1.x - a0.x) * 180 / Math.PI}) scale(1.5)`);
        if (f < 1) return requestAnimationFrame(tick);
        t0 = null;
        if (++i < paths.length) requestAnimationFrame(tick); else { dot.remove(); done(); }
      };
      requestAnimationFrame(tick);
    }
  };
}

// the page: journeys on the left, then the map, then the steps of the one picked. Picking redraws in place (see choose).
function flowView(j0, k0) {
  const all = D.flow.processes, f = document.createDocumentFragment();
  const total = all.reduce((a, P) => a + P.routes.length, 0), solo = all.length === 1 && !total;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur = null, tr = null, fresh = true;
  const sj = all[j0] ? j0 : 0, sk = all[sj].routes[k0] ? k0 : -1;
  shownRun = sj;
  const map = mapParts.size ? lanes(!solo) : null;
  const detail = el('div', {}), jrs = [];

  const mk = (j, k, ...kids) => {
    const b = el('button', {class:'jr', onclick:() => choose(j, k)}, ...kids);
    b.dataset.j = j; b.dataset.k = k; jrs.push(b);
    return b;
  };
  const routesOf = (P, j) => {                     // requests grouped by the folder of their address; bare ones by the file that serves them
    const by = new Map();
    P.routes.forEach((r, k) => {
      const dir = r.path.includes('/') ? r.path.slice(0, r.path.lastIndexOf('/')) : '', key = dir || 'file:' + r.f;
      if (!by.has(key)) by.set(key, {label: dir || r.f.split('/').pop(), ks: []});
      by.get(key).ks.push(k);
    });
    return [...by.values()].map(g => {
      const d = el('details', {class:'grp'}, el('summary', {}, el('span', {title:g.label}, g.label), el('i', {}, g.ks.length)));
      d.open = P.routes.length <= 14;
      g.ks.forEach(k => {
        const r = P.routes[k], b = mk(j, k, el('span', {class:'verb'}, r.verb), el('code', {title:`${r.f}:${r.line}`}, r.path));
        b.grp = d; d.append(b);
      });
      return d;
    });
  };
  const filter = q => {
    q = q.trim().toLowerCase();
    jrs.forEach(b => { b.hidden = !!q && b.dataset.k !== '-1' && !b.textContent.toLowerCase().includes(q); });
    rail.querySelectorAll('.grp').forEach(g => { const any = [...g.querySelectorAll('.jr')].some(b => !b.hidden); g.hidden = !any; if (q && any) g.open = true; });
  };
  const rail = el('nav', {class:'rail', 'aria-label':'Journeys'},
    total > 8 ? el('input', {class:'find', type:'search', placeholder:'Find a request', 'aria-label':'Find a request', oninput:e => filter(e.target.value)}) : null,
    all.length > 1 ? el('select', {class:'rail-pick', 'aria-label':'Pick a program', onchange:e => choose(+e.target.value, -1)},
      all.map((P, j) => el('option', {value:j}, P.name))) : el('h3', {}, 'Program'),
    all.map((P, j) => el('div', {class:'prog'},   // only the picked program's journeys are shown (see show)
      mk(j, -1, svg('flag', 14), el('span', {}, all.length > 1 ? 'Whole program' : P.name)),
      P.routes.length ? [el('h3', {}, 'Web requests'), ...routesOf(P, j)] : null)));
  rail.querySelectorAll('.prog').forEach((b, j) => { b.dataset.j = j; });
  const railPick = rail.querySelector('.rail-pick');
  const pick = el('select', {class:'pick', 'aria-label':'Pick a journey', onchange:e => { const [j, k] = e.target.value.split('/').map(Number); choose(j, k); }},
    all.flatMap((P, j) => [el('option', {value:`${j}/-1`}, P.name), ...P.routes.map((r, k) => el('option', {value:`${j}/${k}`}, `${r.verb} ${r.path}`))]));

  const show = (j, k) => {
    const F = all[j], r = k >= 0 ? F.routes[k] : null;
    shownRun = j;
    tr = trace(r ? r.steps : F.steps, r ? [r.f] : [], r ? r.io || [] : Object.keys(F.io || {}), j);
    jrs.forEach(b => {
      const on = +b.dataset.j === j && +b.dataset.k === k;
      if (on) { b.setAttribute('aria-current', 'true'); if (b.grp) b.grp.open = true; if (!fresh) b.scrollIntoView({block:'nearest'}); } else b.removeAttribute('aria-current');
    });
    pick.value = `${j}/${k}`;
    if (railPick) railPick.value = j;
    rail.querySelectorAll('.prog').forEach(b => { b.hidden = +b.dataset.j !== j; });
    if (map) map.el.querySelectorAll('.node.run').forEach(c => { if (c.dataset.id === 'run:' + j) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current'); });
    cur = r ? (r.steps.length ? outline(r.steps, 2, 'r' + k + '-', map && map.ping) : null) : outline(F.steps, 3, 's', map && map.ping);
    const play = el('button', {class:'play', onclick:() => { play.disabled = true; map.play(tr.seq, () => { play.disabled = false; }); }}, '▶ Play');
    const head = r
      ? [el('p', {}, el('button', {class:'crumb', onclick:() => choose(j, -1)}, '← ' + F.name)),
         el('div', {class:'hline'}, el('span', {class:'verb'}, r.verb), el('h2', {class:'rpath'}, r.path)),
         el('p', {class:'path'}, `${r.f}:${r.line}`),
         ioRow('Takes in', r.io, 'in'), ioRow('Gives out', r.io, 'out')]
      : [el('p', {class:'lead'}, F.narrative),
         F.command ? el('p', {class:'path'}, F.command) : null,
         F.chain.length ? el('div', {class:'lrow', style:'margin-top:16px'}, el('span', {class:'lt'}, 'Started by'), F.chain.map(id => ref(id))) : null,
         el('div', {class:'lrow', style:F.chain.length ? null : 'margin-top:16px'}, el('span', {class:'lt'}, D.flow.kind === 'Entry points' ? 'Starting files' : 'Front door'),
           F.entries.map(id => ref(id))),
         ioRow('Takes in', Object.keys(F.io || {}), 'in', F.io), ioRow('Gives out', Object.keys(F.io || {}), 'out', F.io),
         F.parts.length ? el('div', {class:'lrow'}, el('span', {class:'lt'}, 'Passes through'), chips(F.parts, 16)) : null];
    const sh = sec(r ? 'What runs for this request' : 'Step by step' + (all.length > 1 ? ': ' + F.name : ''),
      'One line per step, in the order the code runs. Indented steps happen inside the step above, and a tag covers the steps under it. Click a name to open its file.');
    if (map && !reduce && tr.seq.length) sh.append(play);
    detail.replaceChildren(el('section', {class:'intro', style:'margin-top:22px'}, head), sh,
      cur || el('p', {class:'empty'}, 'No code of this project runs for it: the framework or an outside library answers it.'));
    if (map) map.light(tr);
    fresh = false;
  };
  onPick = show;

  f.append(el('section', {class:'intro'}, el('h1', {}, 'How it runs'),
    el('p', {class:'lead'}, solo ? 'Follow the program from where it starts to where it ends.'
      : 'Pick a program or a web request. The map shows only the parts it passes through, and its steps are listed below.')));
  const pane = el('div', {class:'pane'}, solo ? null : pick,
    map ? [sec('The map', 'The parts this journey passes through, as a small city. Each box is a building and its kind says what it does. Boxes run left to right in the order the calls reach them, and each one appears once, below the box that first calls it; the steps list every call. Roads run from a part to the parts it calls, and cars drive the way the calls go; dotted paths lead to parts the framework loads or that are imported but not called. Hover a building to follow its roads, or click it to open it.'), map.legend, map.el] : null,
    detail);
  show(sj, sk);
  if (D.flow.unreached.length) pane.append(sec('Not on any journey', 'Nothing above starts or loads these. They run some other way (a separate command, the framework itself) or are not used.'), grid(D.flow.unreached, true));
  f.append(el('div', {class:'trace' + (solo ? ' solo' : '')}, solo ? null : rail, pane));
  return f;
}

/* ---------- render ---------- */
let first = true, lastDepth = 0;
function render() {
  onPick = null;
  const id = route(), isFlow = /^@flow(\/|$)/.test(id) && !!D.flow, target = isFlow ? '@flow' : N[id] ? id : '';
  const depth = isFlow ? 1 : target ? chain(target).length + 1 : 0;
  const view = $('view'), crumbs = $('crumbs');
  view.replaceChildren(isFlow ? flowView(+id.split('/')[1] || 0, id.split('/')[2] != null ? +id.split('/')[2] : -1) : target ? nodeView(N[target]) : overview());
  view.classList.remove('zin', 'zout'); void view.offsetWidth;
  if (!first) view.classList.add(depth < lastDepth ? 'zout' : 'zin');
  first = false; lastDepth = depth;

  const trail = isFlow ? [{id:'@flow', name:'How it runs'}] : target ? chain(target).map(i => ({id:i, name:N[i].name})) : [];
  crumbs.hidden = !trail.length;
  crumbs.replaceChildren();
  [{id:'', name:'Overview'}, ...trail].forEach((t, i, all) => {
    if (i) crumbs.append(el('span', {class:'sep'}, '/'));
    crumbs.append(i === all.length - 1 ? el('span', {class:'here', 'aria-current':'page'}, t.name) : el('button', {class:'crumb', onclick:() => go(t.id)}, t.name));
  });
  const tabs = $('tabs');
  tabs.replaceChildren(el('button', {'aria-current': isFlow ? null : 'page', onclick:() => go('')}, 'About'),
    D.flow ? el('button', {'aria-current': isFlow ? 'page' : null, onclick:() => go('@flow')}, 'How it runs') : null);
  window.scrollTo(0, 0);
  document.title = (isFlow ? 'How it runs - ' : target ? N[target].name + ' - ' : '') + R.name + ' - architecture map';
}

$('repoName').textContent = R.name;
$('foot').textContent = `Generated ${R.generated} by repoatlas from the code's syntax: its folders, imports and calls. It is a guide to the shape of the project, not a guarantee, so confirm anything important in the code.`;
addEventListener('hashchange', () => { if (quiet) quiet = false; else render(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.closest('input,textarea,select')) return;
  const id = route(), m = id.match(/^@flow\/(\d+)\/\d+$/);
  if (m) choose(+m[1], -1);                     // from a request back to its program, then out
  else if (/^@flow(\/|$)/.test(id)) go(''); else if (N[id]) { const up = N[id].parent; go(N[up] && N[up].kind !== 'layer' ? up : ''); }
});
render();
})();
</script>
